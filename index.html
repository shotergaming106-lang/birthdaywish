<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #fed6e3 0%, #a8edea 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            margin: 20px;
            animation: fadeIn 1.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            color: #ff4a75;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .message {
            font-size: 1.1rem;
            color: #444;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        /* Photo Styling */
        .friend-photo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }
        /* Cake and Candle CSS */
        .cake-container {
            position: relative;
            width: 200px;
            height: 160px;
            margin: 0 auto 30px auto;
            cursor: pointer;
        }
        .cake {
            position: absolute;
            bottom: 0;
            width: 200px;
            height: 90px;
            background: #f4a261;
            border-radius: 10px 10px 0 0;
            box-shadow: inset 0 10px 0 #e76f51;
        }
        .cake::before {
            content: "";
            position: absolute;
            top: 30px;
            left: 0;
            width: 200px;
            height: 15px;
            background: #ffffff; /* Cream layer */
        }
        .candle {
            position: absolute;
            bottom: 90px;
            left: 92px;
            width: 16px;
            height: 40px;
            background: linear-gradient(to right, #e63946, #f1faee);
            border-radius: 3px 3px 0 0;
        }
        .flame {
            position: absolute;
            bottom: 130px;
            left: 95px;
            width: 10px;
            height: 20px;
            background: #ffb703;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 10px #ffb703, 0 0 20px #fb8500;
            animation: flicker 0.6s infinite alternate;
            transition: opacity 0.3s ease;
        }
        @keyframes flicker {
            0% { transform: scale(1); }
            100% { transform: scale(1.1) rotate(2deg); }
        }
        /* Music Button */
        .music-btn {
            background: #ff4a75;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 74, 117, 0.3);
            transition: 0.3s;
            margin-top: 10px;
        }
        .music-btn:hover {
            background: #e03861;
            transform: scale(1.05);
        }
        .instruction {
            font-size: 0.9rem;
            color: #777;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Background Music -->
    <!-- Replace URL with your direct audio link later -->
    <audio id="bg-music" loop>
        <source id="music-src" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- Friend's Photo Placeholder -->
        <!-- Replace URL with your friend's image link or filename -->
        <img class="friend-photo" src="https://via.placeholder.com/150" alt="Friend's Picture" id="friend-img">
        
        <h1 id="wish-title">Happy Birthday! 🎉</h1>
        
        <p class="message" id="wish-text">
            আজকের দিনটা তোর অনেক অনেক ভালো কাটুক! তোর জীবনের সব স্বপ্ন সত্যি হোক। কেকের ওপর ক্লিক বা ট্যাপ করে মোমবাতিটি নিভিয়ে দে! ❤️
        </p>

        <!-- Interactive Cake Section -->
        <div class="cake-container" onclick="blowCandle()">
            <div class="flame" id="cake-flame"></div>
            <div class="candle"></div>
            <div class="cake"></div>
        </div>

        <p class="instruction">🎂 কেকের ওপর ট্যাপ করে ফুঁ দাও (মোমবাতি নিভিয়ে দাও)!</p>
        <br>
        <button class="music-btn" onclick="toggleMusic()" id="play-btn">🎵 Play Favourite Song</button>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const playBtn = document.getElementById('play-btn');
        const flame = document.getElementById('cake-flame');

        // Toggle Music Function
        function toggleMusic() {
            if (music.paused) {
                music.play().then(() => {
                    playBtn.innerHTML = "⏸️ Pause Song";
                }).catch(err => {
                    alert("গানের বাটনটি আবার চাপো বা স্ক্রিনে যেকোনো জায়গায় ক্লিক করো!");
                });
            } else {
                music.pause();
                playBtn.innerHTML = "🎵 Play Favourite Song";
            }
        }

        // Blow Candle Function via Click/Tap
        function blowCandle() {
            if (flame.style.opacity !== "0") {
                flame.style.opacity = "0";
                document.getElementById('wish-title').innerHTML = "Yeaaah! Blow Out! 🥳";
                document.getElementById('wish-text').innerHTML = "শুভ জন্মদিন দোস্ত! সবসময় এইভাবে হাসিখুশি থাকিস। Enjoy your day to the fullest!";
                
                alert("মোমবাতি নিভে গেছে! শুভ জন্মদিন! 🎉🎂");
            }
        }
    </script>
</body>
</html>
